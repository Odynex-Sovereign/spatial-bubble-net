version: '3.8'

services:
  neugb-edge-ingress:
    image: nvcr.io/nvidia/clara/holoscan-runtime:v2.0
    container_name: neugb_ingress_node
    restart: always
    network_mode: "host"
    volumes:
      - /dev:/dev
      - ./pipelines:/app/pipelines
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
    command: python3 /app/pipelines/ingress_inference_loop.py

  neugb-spatial-twin:
    image: nvcr.io/nvidia/omniverse/nucleus-client:23.11
    container_name: neugb_nucleus_sync
    restart: always
    depends_on:
      - neugb-edge-ingress
    volumes:
      - ./openusd-schemas:/app/schemas
    environment:
      - OMNI_LOCAL_SOVEREIGNTY=TRUE
      - TUTSA_ENFORCED=TRU
E
